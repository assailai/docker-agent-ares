# =============================================================================
# Ares Docker Agent on Kubernetes, with the bundled companion updater.
# =============================================================================
# One Deployment runs the agent + the updater sidecar. The agent stays
# unprivileged (outbound-only); the updater holds a ServiceAccount scoped to
# get/patch ONLY this Deployment, so on a dashboard "Update" it patches the agent
# container's image and k8s rolls it out. The shared PVC keeps the agent's
# identity across the rollout and carries the update-target handoff file.
#
#   kubectl apply -f deploy/k8s/ares-agent.yaml   (after setting ARES_TOKEN below)
#
# To opt out of auto-update: delete the ares-updater container, the ServiceAccount,
# Role and RoleBinding; update the image via your own pipeline instead.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ares-agent
stringData:
  ARES_TOKEN: "<your-registration-token>"   # one-time token from Settings -> Agents
  # The Ares control plane the agent connects to. The image already defaults to
  # https://ares.assailai.com, so leave this as-is for the SaaS; change it to your own host for a
  # self-hosted or staging control plane (e.g. https://staging.assailai.com).
  ARES_URL: "https://ares.assailai.com"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ares-agent-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ares-updater
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ares-updater
rules:
  # the updater may only read and patch this one Deployment, nothing else.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["ares-agent"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ares-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ares-updater
subjects:
  - kind: ServiceAccount
    name: ares-updater
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ares-agent
  labels:
    app: ares-agent
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the ReadWriteOnce PVC cannot attach to two pods at once,
  # and the old pod must release the agent identity before the new one claims it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ares-agent
  template:
    metadata:
      labels:
        app: ares-agent
    spec:
      serviceAccountName: ares-updater
      # Only the updater needs the Kubernetes API (to patch this Deployment). The agent is the
      # target-facing container, so keep the API token off it: disable the pod-wide automount and
      # project the token into the updater container alone (see the volumes block below).
      automountServiceAccountToken: false
      # A pod on the CNI network only sees the pod namespace. To scan the node's localhost + the
      # LAN + the docker/CNI networks, put the pod on the host network and set
      # ARES_SCAN_SCOPE=host-all (uncomment both):
      #   hostNetwork: true
      #   dnsPolicy: ClusterFirstWithHostNet
      # the agent runs as the non-root "ares" user (uid/gid 10001), but a PVC mounts root-owned,
      # so without this the agent cannot write /data (state + update-target) and crash-loops.
      securityContext:
        fsGroup: 10001
      containers:
        - name: ares-agent          # the patched container; ARES_UPDATE_CONTAINER matches this
          image: assailai/ares-agent:3.12.0   # pinned; the updater rolls this forward
          envFrom:
            - secretRef:
                name: ares-agent
          # The concurrent-connect scanner wants many file descriptors. Kubernetes has no
          # per-container nofile knob, so the agent raises its own RLIMIT_NOFILE soft limit at
          # startup toward the runtime's hard limit (containerd defaults are high); no capability
          # or privilege is required. To scan very large ranges (e.g. ARES_SCAN_SCOPE=rfc1918),
          # raise the runtime's default nofile hard limit on the node.
          volumeMounts:
            - name: data
              mountPath: /data
            # On a cluster behind a TLS-inspecting proxy, put the inspection root CA in a
            # ConfigMap and mount it here; the agent loads every PEM it finds and trusts them
            # alongside the public roots. There is no host CA directory to mount on a node, so
            # this is the Kubernetes equivalent of the /host-ca mount the docker run uses.
            # - name: ca-certs
            #   mountPath: /certs
            #   readOnly: true
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits: { memory: "512Mi", cpu: "500m" }
          # Liveness reflects real contact with Ares: the agent refreshes its last-contact marker
          # on every successful heartbeat/poll, so a network-isolated / wedged agent reads unhealthy
          # and k8s restarts the pod (fresh process => re-resolved DNS + clean thread pool). The
          # in-process watchdog exits on the same condition; this probe is the k8s belt-and-braces.
          livenessProbe:
            exec:
              command: ["python", "-m", "agent.healthcheck"]
            initialDelaySeconds: 90
            periodSeconds: 30
            # the probe cold-starts a Python interpreter (+ pydantic import); the default 1s
            # timeout can flap under the CPU limit / CFS throttling, so match the Docker
            # HEALTHCHECK's 5s. Three misses (failureThreshold) before a restart.
            timeoutSeconds: 5
            failureThreshold: 3
        - name: ares-updater         # companion; keeps ares-agent on the marked version
          image: assailai/ares-updater:3.12.0
          env:
            - name: ARES_UPDATE_CONTAINER
              value: "ares-agent"
            # Fail-closed: verify the image's cosign signature before applying (CI signs published
            # images keyless via OIDC). The expected signer identity + issuer are baked into the
            # updater image; override ARES_UPDATE_COSIGN_IDENTITY / ARES_UPDATE_COSIGN_ISSUER only
            # when self-hosting the images under a different signer.
            - name: ARES_UPDATE_REQUIRE_SIGNATURE
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data        # reads the agent's update-target.json only
              readOnly: true          # never writes the agent's identity in /data
            - name: kube-api-access   # the SA token, mounted into the updater alone (automount off)
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            # cosign reaches the registry and the Sigstore log through the same proxy and fails
            # closed when it cannot verify, so the updater needs the same CAs as the agent.
            # - name: ca-certs
            #   mountPath: /certs
            #   readOnly: true
          resources:
            requests: { memory: "64Mi", cpu: "20m" }
            limits: { memory: "128Mi", cpu: "100m" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ares-agent-data
        # The ServiceAccount token, projected into the updater container only (automount is off
        # above), so the target-facing agent never holds a token that can patch the Deployment.
        # kube-root-ca.crt is the ConfigMap Kubernetes publishes in every namespace.
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        # Pair with the /certs mounts above:
        #   kubectl create configmap ares-ca-certs --from-file=corp-root.crt=/path/to/root.crt
        # - name: ca-certs
        #   configMap:
        #       name: ares-ca-certs
