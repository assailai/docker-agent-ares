name: Build and Publish Docker Image

# No `tags: v*` trigger. Anyone with push access can create a tag, and that run would have
# reached the Docker Hub credentials and signed an image under a release tag with the identity the
# whole fleet trusts - without the commit ever being reviewed on main. auto-tag.yml is the one
# producer of release images, and it only runs on a merge to the protected branch. Tag creation
# cannot be blocked at the ref: GitHub will not accept the Actions app as a ruleset bypass actor
# here, so the rule would stop auto-tag.yml pushing the release tag too (ARES-2351). This trigger
# staying absent is what makes that survivable.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    # main only for a manual dispatch too. A dispatch runs the workflow files as they exist on the
    # chosen ref, so this guard alone does not stop someone who can push a branch from editing it
    # out - but an image signed at refs/heads/<their-branch> is not an identity the updater trusts
    # (see updater/config.py), and the Docker Hub credentials live in the `release` environment.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write   # allow the reusable workflow to request an OIDC token for cosign
    uses: ./.github/workflows/docker-build.yml
    with:
      # Branch name (e.g. main), PR ref, short sha, and `latest` on the default branch.
      # No semver lines: release tags have exactly one producing path, auto-tag.yml.
      meta_tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=sha,prefix=
        type=raw,value=latest,enable={{is_default_branch}}
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
