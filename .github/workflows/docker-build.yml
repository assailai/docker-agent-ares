# Reusable image build/push/sign pipeline.
#
# Shared by docker-publish.yml (branch / PR / manual-tag builds) and auto-tag.yml
# (semver release builds). Callers pass the docker/metadata-action `tags` config via
# `meta_tags`, choose whether to push via `push`, and MUST forward `secrets: inherit`
# so the Docker Hub credentials reach this workflow.
name: Docker Build

on:
  workflow_call:
    inputs:
      meta_tags:
        description: "docker/metadata-action `tags` config (newline-separated)."
        required: true
        type: string
      push:
        description: "Push and sign the image. Set false for PR validation builds."
        required: false
        default: true
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # `release` holds the Docker Hub credentials and is restricted to the protected branch, so
    # GitHub refuses the job on any other ref rather than trusting the in-job guard below - which
    # lives in a file an unreviewed ref could edit. A PR validation build pushes nothing and needs
    # no credentials, so it names a second, unprotected environment: `name` takes an expression,
    # but what an EMPTY name does is undocumented, so never produce one.
    environment:
      name: ${{ inputs.push && 'release' || 'pr-validation' }}
    permissions:
      contents: read
      id-token: write   # keyless cosign signing via OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          # the agent and its companion updater are separate images, both published multi-arch.
          - dockerfile: Dockerfile
            image: assailai/ares-agent
          - dockerfile: Dockerfile.updater
            image: assailai/ares-updater

    steps:
      # Fulcio takes the certificate SAN from job_workflow_ref, and the ref there is the CALLER's.
      # The updater trusts exactly one: this workflow at refs/heads/main, the protected branch.
      # Anything else must not reach the registry login, the push or the signature, so fail before
      # the first of them rather than publish something nobody reviewed.
      - name: Refuse to publish from an unreviewed ref
        if: inputs.push && github.ref != 'refs/heads/main'
        run: |
          echo "::error::push requested from ${{ github.ref }}; release images are built from refs/heads/main only"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          # The action's own default is `tonistiigi/binfmt:latest`, which it runs --privileged on
          # the runner that holds the Docker Hub token and `id-token: write`. Pinning the action
          # and leaving its image floating pins nothing: whoever can move that tag runs code in
          # the signing job. Dependabot does not read this value, so it is bumped by hand.
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0  # qemu-v10.2.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
        with:
          # The same hole as the emulator above, one step further in: the docker-container driver's
          # own default builder is `moby/buildkit:buildx-stable-1`, and THAT container is what reads
          # the Dockerfile, produces the layers and pushes them - so whoever moves that upstream tag
          # decides the bytes `cosign sign` signs below, under the one identity the whole fleet
          # trusts. Pinning the action and leaving its builder floating pins nothing; it only moves
          # who gets to choose. Dependabot does not read this value either, so it is bumped by hand.
          driver-opts: |
            image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ matrix.image }}
          tags: ${{ inputs.meta_tags }}

      # nothing is pushed, tagged or signed until the image passes this, on PR builds and release
      # builds alike. These images run inside customer networks, the updater next to the Docker
      # socket, so a known vulnerability with a fix available is a reason not to publish. In
      # October 2026 an external assessment found the distrusted certifi roots in the agent and
      # dozens of High/Critical findings in the updater's cosign, in images that had passed every
      # check here.
      #
      # Grype, because it classifies runtime binaries a package-only scan misses: the Go stdlib
      # and modules compiled into cosign, a Node or Python interpreter. --only-fixed keeps
      # the gate to what we can act on, so a new advisory with no fix cannot block a release.
      # amd64 only: `load` cannot hold a multi-arch image, and both architectures install the same
      # pinned packages and the same cosign release.
      - name: Build a local copy to scan
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: scan-target:local
          cache-from: type=gha,scope=${{ matrix.dockerfile }}

      - name: Refuse a fixable High or Critical vulnerability
        env:
          # pinned by digest because a tag can be repointed and a digest cannot
          GRYPE: anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$GRYPE" docker:scan-target:local --only-fixed --fail-on high

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

      # keyless (OIDC) signing so the companion updater can cosign-verify the target before it
      # applies an update. Sign the manifest by digest, which covers every tag pointing at it.
      # Skipped when not pushing (PRs).
      - name: Sign the image
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --recursive --yes "${{ matrix.image }}@${DIGEST}"
