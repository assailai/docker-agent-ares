# Reusable image build/push/sign pipeline.
#
# Shared by docker-publish.yml (branch / PR / manual-tag builds) and auto-tag.yml
# (semver release builds). Callers pass the docker/metadata-action `tags` config via
# `meta_tags`, choose whether to push via `push`, and MUST forward `secrets: inherit`
# so the Docker Hub credentials reach this workflow.
name: Docker Build

on:
  workflow_call:
    inputs:
      meta_tags:
        description: "docker/metadata-action `tags` config (newline-separated)."
        required: true
        type: string
      push:
        description: "Push and sign the image. Set false for PR validation builds."
        required: false
        default: true
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # keyless cosign signing via OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          # the agent and its companion updater are separate images, both published multi-arch.
          - dockerfile: Dockerfile
            image: assailai/ares-agent
          - dockerfile: Dockerfile.updater
            image: assailai/ares-updater

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: ${{ inputs.meta_tags }}

      # nothing is pushed, tagged or signed until the image passes this, on PR builds and release
      # builds alike. These images run inside customer networks, the updater next to the Docker
      # socket, so a known vulnerability with a fix available is a reason not to publish. In
      # October 2026 an external assessment found the distrusted certifi roots in the agent and
      # dozens of High/Critical findings in the updater's cosign, in images that had passed every
      # check here.
      #
      # Grype, because it classifies runtime binaries a package-only scan misses: the Go stdlib
      # and modules compiled into cosign, a Node or Python interpreter. --only-fixed keeps
      # the gate to what we can act on, so a new advisory with no fix cannot block a release.
      # amd64 only: `load` cannot hold a multi-arch image, and both architectures install the same
      # pinned packages and the same cosign release.
      - name: Build a local copy to scan
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: scan-target:local
          cache-from: type=gha,scope=${{ matrix.dockerfile }}

      - name: Refuse a fixable High or Critical vulnerability
        env:
          # by digest: a tag can be repointed, and the gate's own scanner must not move under it
          GRYPE: anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$GRYPE" docker:scan-target:local --only-fixed --fail-on high

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

      # keyless (OIDC) signing so the companion updater can cosign-verify the target before it
      # applies an update. Sign the manifest by digest, which covers every tag pointing at it.
      # Skipped when not pushing (PRs).
      - name: Sign the image
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --recursive --yes "${{ matrix.image }}@${DIGEST}"
