# Turn a version bump into a release automatically.
#
# When a merge to main changes agent/__version__.py, this workflow creates the matching
# `v<version>` git tag and a GitHub release, then builds the semver-pinned images
# (<version>, <major>.<minor>, <major>).
#
# Why it builds the images itself: the tag is created with the default GITHUB_TOKEN, and
# GitHub deliberately does NOT let a GITHUB_TOKEN push re-trigger another workflow. So a
# `push: tags: v*` build would never fire from here. Rather than require a PAT, we call the
# shared reusable workflow directly. Ordinary (non-version) pushes to main don't run this,
# so semver image tags stay immutable.
name: Auto Tag Release

on:
  push:
    branches:
      - main
    paths:
      - 'agent/__version__.py'
  workflow_dispatch:   # allow re-running for a version whose file already landed

jobs:
  tag:
    # main only, dispatch included: this job creates release tags and calls the signing workflow,
    # and a dispatch on an arbitrary ref would run the workflow file as it exists on that ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the GitHub release
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      # not "did I create the tag": a tag this run finds already on this very commit (a hand-pushed
      # one, or an earlier run that died after tagging) still has no images, and skipping the build
      # for it is what left releases tagged but unpublished.
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # full history + existing tags for existence check / release notes

      - name: Read agent version
        id: ver
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' agent/__version__.py)"
          if [ -z "$version" ]; then
            echo "::error::Could not parse __version__ from agent/__version__.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # An existing tag is not proof that the release was already cut from main. This step used to
      # accept one by NAME alone: it exited green with the image build skipped, so an account with
      # push access but no right to merge could create the upcoming v<version> on a commit of its
      # own, and the ruleset then made THAT commit the permanent release tag - the one every
      # documented install URL fetches bootstrap.sh and the k8s manifest from, before any cosign
      # check the genuine script would do. So judge the commit, not the name (ARES-2351).
      - name: Create tag and release if new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # ^{commit} so an annotated tag and a lightweight one answer the same question.
          if at="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")"; then
            # 1. it has to name a commit in this branch's reviewed history. Anything else is
            #    unreviewed code wearing a release name, and the run fails rather than skipping.
            if ! git merge-base --is-ancestor "${at}" "${GITHUB_SHA}"; then
              echo "::error::${TAG} points at ${at}, which is not in the history of main at ${GITHUB_SHA}. A release tag must name a reviewed commit. Find out who pushed it; note that the v* ruleset refuses deletion, so clearing it needs someone with ruleset admin to lift that rule, delete the tag, and put it back."
              exit 1
            fi
            # 2. and it has to be the commit that cut THIS version. Check 1 on its own would wave
            #    through a tag parked on any older main commit.
            tagged="$(git show "${at}:agent/__version__.py" 2>/dev/null | sed -n 's/^__version__ = "\(.*\)"/\1/p' || true)"
            if [ "${tagged}" != "${VERSION}" ]; then
              echo "::error::${TAG} points at ${at}, whose agent/__version__.py reads '${tagged:-nothing}' rather than ${VERSION}."
              exit 1
            fi
            # 3. a legitimate tag on THIS commit is a release that was started and may have no
            #    images: an earlier run that died after tagging, or a dispatch re-run. Build it.
            #    On an older commit it is a past release, and rebuilding would publish a different
            #    digest under a semver tag that is supposed to be immutable, so leave it alone.
            #
            #    That cuts both ways, and the limit is deliberate: the repair only works while
            #    main's HEAD is still the bump commit. Let one unrelated merge land after a
            #    release that died post-tag and a dispatch reports "earlier release; nothing to
            #    do", with no way back - the images have to be published by hand. Widening this
            #    to "the newest commit carrying this version" would fix that and would also let
            #    an ordinary dispatch republish a release that already has images, under a semver
            #    tag whose whole promise is one set of bytes. Of the two, a manual repair is the
            #    cheaper failure, so the limit stays and is written down (ARES-2351, review).
            if [ "${at}" = "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already names this commit; building its images."
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag ${TAG} is the earlier release at ${at}; nothing to do."
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Ares Docker Agent ${VERSION}"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            --title "Ares Docker Agent ${VERSION}" \
            --generate-notes
          echo "build=true" >> "$GITHUB_OUTPUT"

  images:
    needs: tag
    if: needs.tag.outputs.build == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-build.yml
    with:
      meta_tags: |
        type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
        type=semver,pattern={{major}},value=${{ needs.tag.outputs.tag }}
      push: true
    secrets: inherit
