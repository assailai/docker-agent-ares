version: 2
# until this file existed nothing proposed a bump here at all, which is how certifi kept trusting
# a compromised CA root (ARES-1993). The 7-day cooldown guards against a malicious or broken release.
#
# not covered: cosign itself. Dockerfile.updater builds it from the tag in ARG COSIGN_VERSION, which
# Dependabot does not read; ares-v2's published-image-scan.yml rescans the published updater daily,
# cosign included, and that is what flags a stale one. The golang image that builds it IS covered,
# by the docker entry below, so the Go standard library compiled into cosign keeps moving.
updates:
  # Covers requirements.txt / requirements-updater.txt AND the generated *-lock.txt beside them,
  # which is why those are named .txt rather than .lock: locking the transitive set would otherwise
  # have cost exactly the Dependabot coverage it was meant to extend. All four share pins, and
  # tests/test_image_pins.py fails a bump that moves one file and not the others.
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    cooldown: { default-days: 7 }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # not grouped: both Dockerfiles use python:3.12-alpine, now pinned by digest, so its proposals
  # are the base rebuilds this repository must adopt deliberately (and interpreter upgrades,
  # 3.12 -> 3.13, which should arrive on their own); the cosign
  # builder's golang image is pinned to a patch and a digest, so its proposals are toolchain bumps
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    cooldown: { default-days: 7 }
    ignore:
      # our own images (docker-compose.yml), which a release moves together with
      # agent/__version__.py; test_every_install_path_pins_the_release_being_cut holds them to it
      - dependency-name: "*assailai/ares-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "ci(deps)" }
    cooldown: { default-days: 7 }
    groups:
      github-actions:
        update-types: [minor, patch]
