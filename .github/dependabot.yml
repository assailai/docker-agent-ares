version: 2
# until this file existed nothing proposed a bump here at all, which is how certifi kept trusting
# a compromised CA root (ARES-1993). The 7-day cooldown guards against a malicious or broken release.
#
# not covered: cosign. Dockerfile.updater downloads it by ARG COSIGN_VERSION, which Dependabot does
# not read; ares-v2's published-image-scan.yml rescans the published updater daily, cosign included,
# and that is what flags a stale one.
updates:
  # requirements.txt and requirements-updater.txt share pins; tests/test_image_pins.py fails a bump
  # that moves one and not the other
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    cooldown: { default-days: 7 }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # not grouped: both Dockerfiles use python:3.12-alpine, a tag with no patch number, so every
  # proposal here is an interpreter upgrade (3.12 -> 3.13) and should arrive on its own
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    cooldown: { default-days: 7 }
    ignore:
      # our own images (docker-compose.yml), which a release moves together with
      # agent/__version__.py; test_every_install_path_pins_the_release_being_cut holds them to it
      - dependency-name: "*assailai/ares-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "ci(deps)" }
    cooldown: { default-days: 7 }
    groups:
      github-actions:
        update-types: [minor, patch]
