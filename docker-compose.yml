# =============================================================================
# Ares Docker Agent - Docker Compose (production)
# =============================================================================
# Two steps: pin the images this release publishes, then set ARES_TOKEN (a registration token
# from the Ares dashboard) and run.
#
#   bash scripts/verify-images.sh     # cosign-verifies both images, writes their digests to .env
#   ARES_TOKEN=ares_agt_... docker compose up -d
#   docker compose logs -f            # watch it enroll and come online
#
# The first step is not optional: the services below name no image of their own, so compose
# refuses to start until .env holds the digests it checked (ARES-2351).
#
# Outbound-only (HTTPS + WebSocket to ares); no published ports, no extra capabilities.
# The ares-updater companion keeps the agent, and then itself, on the version the dashboard
# marks current (a dashboard "Update" recreates the agent on the new, signed image). Only the
# updater holds the Docker socket; the agent stays unprivileged. To opt out of auto-update, remove
# the ares-updater service; to keep only the updater where it is, set ARES_UPDATE_SELF_UPDATE=false.
# It finds itself by its container_name below, so keep that name.
# =============================================================================

services:
  ares-agent:
    # Named through .env with no default, so compose stops here rather than starting something
    # unverified: scripts/verify-images.sh cosign-verifies this release's agent image and writes
    # the DIGEST it checked into .env. Whoever can write to the Docker Hub repositories can
    # repoint a tag; they cannot forge that signature, and a digest cannot be repointed at all.
    # For another release run that script with ARES_VERSION=X.Y.Z (see Settings -> Agents).
    #
    # _DIGEST, not _IMAGE, and that is not cosmetic: ARES_IMAGE / ARES_UPDATER_IMAGE are INPUTS to
    # that script and to bootstrap.sh, naming an image to verify. Compose prefers the shell
    # environment over .env, so sharing a name would let an exported override silently outrank the
    # digest the script just checked - starting the socket-holding updater from a mutable tag.
    image: ${ARES_AGENT_DIGEST:?run scripts/verify-images.sh first - it verifies docker.io/assailai/ares-agent:3.15.1 and writes the digest it checked to .env}
    container_name: ares-agent
    hostname: ares-agent
    volumes:
      - ares-agent-data:/data
      # This host's CA store, read-only. On a network that inspects TLS, the inspection root is
      # already trusted here (it has to be, or nothing on the machine could browse), so handing it
      # over is all the agent needs. On a network that does not, this is an ordinary public bundle
      # and a no-op. Public certificates only: /etc/ssl/private is never mounted. On RHEL and
      # Fedora use /etc/pki/ca-trust/extracted/pem instead; that directory holds one bundle per
      # purpose, and only tls-ca-bundle.pem is loaded - the e-mail and code-signing extracts are
      # not valid issuers for a server certificate.
      - /etc/ssl/certs:/host-ca:ro
      # This host's /etc/hosts, read-only. A container gets docker's own /etc/hosts even under
      # network_mode: host, so without this a name pinned on the machine never reaches the agent.
      # Re-read when it changes, so adding a pin later needs no recreate.
      - /etc/hosts:/host-hosts:ro
    # Headroom for the concurrent-connect scanner (still non-root).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Raw-socket capability for the OPT-IN agent-origin packet capture
    # (ARES_ASSESSMENT_PCAP=1, off by default; see agent/pcap_capture.py). Without it tcpdump
    # cannot bind and capture fails soft, leaving the agent otherwise unchanged and non-root.
    cap_add:
      - NET_RAW
    # A bridge-networked container only sees its own namespace, so it cannot reach the host's
    # localhost services and auto-detection sees the container bridge, not the LAN. To scan the
    # host localhost + the LAN + the docker networks, run on the host network (Linux only) and set
    # ARES_SCAN_SCOPE=host-all below. Uncomment (and drop `hostname:` above, which host mode rejects):
    #   network_mode: host
    # On Docker Desktop (Mac/Windows) host mode does not expose the host's localhost; set
    # ARES_NETWORKS explicitly there instead.
    environment:
      - ARES_TOKEN=${ARES_TOKEN:?set ARES_TOKEN to a registration token from the dashboard}
      # - ARES_URL=https://ares.assailai.com       # override when self-hosting
      # - ARES_NETWORKS=10.0.0.0/24,192.168.0.0/16 # override auto-detection with explicit CIDRs
      #     A decision, not a hint: nothing widens it, so discovery below is switched off entirely.
      # - ARES_SCAN_SCOPE=host-all                 # reachable (default) | supernet16 | attached | rfc1918 | host-all
      #     "reachable" advertises the attached subnets AND every private network the agent can
      #     demonstrably reach (the machine's routing and neighbour tables, plus a probe of private
      #     space). It is what finds a customer's 10.x estate from an agent sitting on 172.23.x.
      #     Discovery runs in the background, so the agent still comes online in seconds.
      # - ARES_REACH_PROBE=false                   # keep the tables, skip the active probe
      # - ARES_REACH_BUDGET_SECONDS=600            # wall clock the probe may spend
      # - ARES_REACH_REFRESH_SECONDS=21600         # how often to look again; 0 = once, at startup
      #     Only while "Rescan automatically" is on in the dashboard. With it off the agent looks
      #     once, at install, and reuses that answer across restarts.
      # - ARES_HOST_ALIASES=sso.acme.internal=10.1.2.3,portal.acme.internal=10.1.2.4
      #     Pin a name the host's resolver will not answer. Only needed when the pin is not already
      #     in this host's /etc/hosts (mounted above).
    restart: unless-stopped

  ares-updater:
    # Same as the agent, and this is the container it matters most for: it is the one handed
    # the Docker socket below, so an image substituted here is root on this host - and it would
    # then be the thing deciding every later verification.
    image: ${ARES_UPDATER_DIGEST:?run scripts/verify-images.sh first - it verifies docker.io/assailai/ares-updater:3.15.1 and writes the digest it checked to .env}
    container_name: ares-updater
    volumes:
      - ares-agent-data:/data:ro                  # reads the agent's update-target.json
      # Recreates the agent on a new version. On Podman there is no /var/run/docker.sock: use
      # /run/podman/podman.sock (rootful, after `sudo systemctl enable --now podman.socket`) or
      # $XDG_RUNTIME_DIR/podman/podman.sock (rootless, after `systemctl --user enable --now
      # podman.socket`) as the left-hand side, or the updater cannot start and the agent never
      # updates.
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/ssl/certs:/host-ca:ro                 # cosign needs the host CAs through an inspecting proxy
    # Under SELinux (RHEL, Fedora) a container may not connect to the engine socket without this.
    # It confines nothing that matters: whoever holds the engine socket already holds the host.
    security_opt:
      - label=disable
    environment:
      # Fail-closed: verify the image's cosign signature before applying (CI signs published images
      # keyless via OIDC). The expected signer identity + issuer are baked into the updater image;
      # override ARES_UPDATE_COSIGN_IDENTITY / ARES_UPDATE_COSIGN_ISSUER only when self-hosting the
      # images under a different signer, or set ARES_UPDATE_REQUIRE_SIGNATURE=false for local/dev
      # with unsigned images.
      - ARES_UPDATE_REQUIRE_SIGNATURE=true
      # The updater refuses to move the agent to a release older than its own: a signed-but-old
      # image is still a downgrade attack, since the signature is genuine and the version handoff
      # is not. Uncomment for a deliberate, operator-driven rollback.
      # - ARES_UPDATE_ALLOW_DOWNGRADE=true
    restart: unless-stopped

volumes:
  ares-agent-data:
    driver: local
