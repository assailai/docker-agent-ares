# =============================================================================
# Ares Docker Agent - Docker Compose (production)
# =============================================================================
# Zero-touch: set ARES_TOKEN (a registration token from the Ares dashboard) and run.
#
#   ARES_TOKEN=ares_agt_... docker compose up -d
#   docker compose logs -f            # watch it enroll and come online
#
# Outbound-only (HTTPS + WebSocket to ares); no published ports, no extra capabilities.
# The ares-updater companion keeps the agent on the version the dashboard marks current
# (a dashboard "Update" recreates the agent on the new, signed image). Only the updater
# holds the Docker socket; the agent stays unprivileged. To opt out of auto-update, remove
# the ares-updater service.
# =============================================================================

services:
  ares-agent:
    image: assailai/ares-agent:3.9.0  # pin to a version (see Settings -> Agents); avoid :latest
    container_name: ares-agent
    hostname: ares-agent
    volumes:
      - ares-agent-data:/data
      # This host's CA store, read-only. On a network that inspects TLS, the inspection root is
      # already trusted here (it has to be, or nothing on the machine could browse), so handing it
      # over is all the agent needs. On a network that does not, this is an ordinary public bundle
      # and a no-op. Public certificates only: /etc/ssl/private is never mounted. On RHEL and
      # Fedora use /etc/pki/ca-trust/extracted/pem instead.
      - /etc/ssl/certs:/host-ca:ro
      # This host's /etc/hosts, read-only. A container gets docker's own /etc/hosts even under
      # network_mode: host, so without this a name pinned on the machine never reaches the agent.
      # Re-read when it changes, so adding a pin later needs no recreate.
      - /etc/hosts:/host-hosts:ro
    # Headroom for the concurrent-connect scanner (still non-root, no added capabilities).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # A bridge-networked container only sees its own namespace, so it cannot reach the host's
    # localhost services and auto-detection sees the container bridge, not the LAN. To scan the
    # host localhost + the LAN + the docker networks, run on the host network (Linux only) and set
    # ARES_SCAN_SCOPE=host-all below. Uncomment (and drop `hostname:` above, which host mode rejects):
    #   network_mode: host
    # On Docker Desktop (Mac/Windows) host mode does not expose the host's localhost; set
    # ARES_NETWORKS explicitly there instead.
    environment:
      - ARES_TOKEN=${ARES_TOKEN:?set ARES_TOKEN to a registration token from the dashboard}
      # - ARES_URL=https://ares.assailai.com       # override when self-hosting
      # - ARES_NETWORKS=10.0.0.0/24,192.168.0.0/16 # override auto-detection with explicit CIDRs
      #     A decision, not a hint: nothing widens it, so discovery below is switched off entirely.
      # - ARES_SCAN_SCOPE=host-all                 # reachable (default) | supernet16 | attached | rfc1918 | host-all
      #     "reachable" advertises the attached subnets AND every private network the agent can
      #     demonstrably reach (the machine's routing and neighbour tables, plus a probe of private
      #     space). It is what finds a customer's 10.x estate from an agent sitting on 172.23.x.
      #     Discovery runs in the background, so the agent still comes online in seconds.
      # - ARES_REACH_PROBE=false                   # keep the tables, skip the active probe
      # - ARES_REACH_BUDGET_SECONDS=600            # wall clock the probe may spend
      # - ARES_REACH_REFRESH_SECONDS=21600         # how often to look again; 0 = once, at startup
      #     Only while "Rescan automatically" is on in the dashboard. With it off the agent looks
      #     once, at install, and reuses that answer across restarts.
      # - ARES_HOST_ALIASES=sso.acme.internal=10.1.2.3,portal.acme.internal=10.1.2.4
      #     Pin a name the host's resolver will not answer. Only needed when the pin is not already
      #     in this host's /etc/hosts (mounted above).
    restart: unless-stopped

  ares-updater:
    image: assailai/ares-updater:3.9.0
    container_name: ares-updater
    volumes:
      - ares-agent-data:/data:ro                  # reads the agent's update-target.json
      - /var/run/docker.sock:/var/run/docker.sock  # recreates the agent on a new version
      - /etc/ssl/certs:/host-ca:ro                 # cosign needs the host CAs through an inspecting proxy
    environment:
      # Fail-closed: verify the image's cosign signature before applying (CI signs published images
      # keyless via OIDC). The expected signer identity + issuer are baked into the updater image;
      # override ARES_UPDATE_COSIGN_IDENTITY / ARES_UPDATE_COSIGN_ISSUER only when self-hosting the
      # images under a different signer, or set ARES_UPDATE_REQUIRE_SIGNATURE=false for local/dev
      # with unsigned images.
      - ARES_UPDATE_REQUIRE_SIGNATURE=true
    restart: unless-stopped

volumes:
  ares-agent-data:
    driver: local
